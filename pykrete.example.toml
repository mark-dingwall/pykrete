# Pykrete config. Copy to `pykrete.toml` in the directory you run from, or pass
# `--config <path>`. Without it, Pykrete exits 2 with "cannot read config at pykrete.toml".
#
# PREREQUISITES
#   1. `pi` on PATH (npm i -g @earendil-works/pi-coding-agent@0.80.10), or set PYKRETE_PI_BIN.
#   2. NANOGPT_API_KEY exported in the environment, or set in a `.env` file in this directory
#      (see .env.example) — Pykrete reads `.env` automatically; a non-empty shell env still wins
#      if both are set. A missing key exits 2 with a clear message.
#
# Invocation: pykrete [--task <task>] [--family <family>] [--config <path>] "<prompt>"

# Family used when --family is omitted. Must be a key in [families].
default_family = "glm"

[catalog]
# How long the NanoGPT model catalog is cached before it is re-fetched, in seconds.
ttl_seconds = 3600

# Candidate chains, in failover order — Pykrete tries each id in turn. Track FAMILIES, not
# pinned versions: NanoGPT ids move fast, and a dead id costs a failover hop on every run.
# Verify ids against https://nano-gpt.com/api/v1/models before committing them.
[families]
glm = ["zai-org/glm-5.2:thinking", "zai-org/glm-5.2", "zai-org/glm-5.1:thinking"]
kimi = ["moonshotai/kimi-k2.6:thinking", "moonshotai/kimi-k2.7-code"]
deepseek = ["deepseek/deepseek-v4-pro-cheaper:thinking", "deepseek/deepseek-v4-pro-cheaper"]

# Per-task lead model, selected by `--task`. The chosen id is tried first, then `general`'s
# pick, then the rest of the family list. Every id here must appear in its family's list above.
# `general` is the fallback task when --task is omitted or names no entry here.
[defaults.general]
glm = "zai-org/glm-5.2"
kimi = "moonshotai/kimi-k2.6:thinking"
deepseek = "deepseek/deepseek-v4-pro-cheaper"

[defaults.code]
glm = "zai-org/glm-5.2:thinking"
kimi = "moonshotai/kimi-k2.7-code"
deepseek = "deepseek/deepseek-v4-pro-cheaper:thinking"

# Transport liveness and watchdog timeouts. Defaults apply if this table is omitted entirely.
[liveness]
# Inject a sentinel nonce and resume if it is missing from the terminal message.
nonce_enabled = true
# Idle watchdog. Keep this ABOVE 300: pi's own undici HTTP idle window is 300s, and this
# deliberately sits outside it so pi self-heals first. A lower value kills a healthy pi
# mid-request — the exact failure the watchdog exists to prevent. Not currently enforced.
idle_timeout_seconds = 330
# Resume attempts per candidate after a missing nonce or an idle trip.
resume_attempts = 1
# How long to wait for pi's first stdout line before treating startup as stalled.
startup_timeout_seconds = 180
# Hard cap on a single attempt (one candidate, one launch), from spawn to close.
overall_timeout_seconds = 1800
# Hard cap on the whole failover run, across every candidate. Time spent paused waiting out a
# NanoGPT outage does not count against this. A family with N candidates can legitimately need up
# to N x overall_timeout_seconds, so raise this if you also raise overall_timeout_seconds or add
# candidates to a family.
deadline_seconds = 3600
# Grace period between SIGTERM and the SIGKILL escalation when a watchdog fires.
kill_grace_seconds = 5
# Timeout for the reachability probe (GET /models) used to distinguish a NanoGPT outage from a
# genuine model failure.
probe_timeout_seconds = 4

# Retry behaviour. Defaults apply if this table is omitted entirely.
[retry]
# Pi's own same-model transient retry, passed through to the generated settings.json.
max_retries = 3
base_delay_ms = 2000
max_retry_delay_ms = 60000
# Pykrete's own reachability-probe backoff ladder (distinct from the retry above: this backs off
# re-probing NanoGPT during an outage, not re-sending a model request).
outage_backoff_base_ms = 1000
outage_backoff_factor = 2
outage_backoff_cap_ms = 1024000
max_outage_retries = 10
